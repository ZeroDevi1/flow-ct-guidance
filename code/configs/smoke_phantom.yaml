# 冒烟配置：合成相位体 + 小网络，CPU 几分钟 / GPU 几十秒。只验证代码跑通。
seed: 0
out_dir: checkpoints/smoke_phantom
data:
  type: phantom
  n: 256
model:
  in_ch: 1
  out_ch: 1
  base_ch: 32
  ch_mult: [1, 2, 2]
  num_res: 1
  attn_res: [16]
  image_size: 64
train:
  batch_size: 16
  lr: 2.0e-4
  max_steps: 300
  warmup: 50
  ema: 0.99
  log_every: 50
  sample_every: 300
  sample_nfe: 20
  num_workers: 0
  amp: false
