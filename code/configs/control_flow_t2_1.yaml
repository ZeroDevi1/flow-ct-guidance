# Track 2-1：2D 测量条件化流微调（15 CU 硬止损门控）
# 冻结 19.8M 无条件流先验，挂载 2D 零卷积 ControlNet（~7.9M 可训练参数）
seed: 0
out_dir: checkpoints/control_flow_t2_1
prior_ckpt: checkpoints/prior_256/ema_final.pt
data:
  processed_dir: /content/data/processed
  split: train
  val_split: val
  val_probe_n: 16
control:
  cond_ch: 4
  geom_dim: 182
# 多几何训练采样分布（重点覆盖门控目标 la120/la90，同时保留随机限角、稀疏与低剂量泛化）
geometry_mix:
  la120: 0.30
  la90: 0.30
  la_rand: 0.15
  sv: 0.15
  ld: 0.10
  la_rand_min_deg: 80
  la_rand_max_deg: 150
  ld_i0_choices: [10000.0, 30000.0, 100000.0, 300000.0]
  mu_scale: 0.06
train:
  batch_size: 16
  lr: 2.0e-4
  lr_min: 1.0e-5
  wd: 0.0
  warmup: 500
  max_steps: 15000
  ema: 0.999
  t_mode: uniform
  log_every: 100
  save_every: 2000
  val_every: 2500
  val_nfe: 25
  num_workers: 6
  amp: true
